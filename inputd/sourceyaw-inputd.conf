# Source Yaw input service: the only keys and mouse axes it forwards.
# Root-owned on purpose: programs running as you cannot widen this list.
# After editing: sudo systemctl restart sourceyaw-inputd.socket
user = @USER@
keys = KEY_A KEY_D KEY_SPACE KEY_LEFTALT KEY_L KEY_O KEY_P BTN_LEFT BTN_RIGHT
axes = REL_X REL_WHEEL
